[package]
name = "pico-wlan-template"
version = "0.2.0"
edition = "2024"

[build-dependencies]
regex = "1.11.0"

[dependencies]
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
] }


panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.5"


defmt = "1.0.1"
defmt-rtt = "1.0.0"
fixed = "1.23.1"
fixed-macro = "1.2"

# dotenvy = "0.15"
embassy-time = { version = "0.5.0" }
embassy-usb = { version = "0.6.0", features = ["defmt"] }

embassy-net = { version = "0.9.1", features = [
  "defmt",
  "icmp",
  "tcp",
  "udp",
  "raw",
  "dhcpv4",
  "medium-ethernet",
  "dns",
  "proto-ipv4",
  "proto-ipv6",
  "multicast",
] }

embassy-net-wiznet = { version = "0.3.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-usb-logger = { version = "0.6.0" }
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }

static_cell = "2.1"
# for web request example
reqwless = { git = "https://github.com/drogue-iot/reqwless", rev = "68f703dfc16e6f7f964b7238c922c0d433118872", features = [
  "defmt",
] }
serde = { version = "1.0.203", default-features = false, features = ["derive"] }
serde-json-core = "0.5.1"


[target."thumbv8m.main-none-eabihf".dependencies]
embassy-rp = { version = "0.10.0", features = [
  "defmt",
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
] }

[target.thumbv6m-none-eabi]
embassy-rp = { version = "0.9.0", features = [
  "defmt",
  "time-driver",
  "critical-section-impl",
  "rp2040",
  "binary-info",
] }

[target.riscv32imac-unknown-none-elf]
embassy-rp = { version = "0.9.0", features = [
  "defmt",
  "time-driver",
  "critical-section-impl",
  "rp2350",
  "binary-info",
] }
